<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassCal</title>
</head>
<body>

  <h1>ClassCal</h1>

  <!-- TERM DATES -->
  <h2>Term dates</h2>
  <div>
    <label>First day of classes: <input type="date" id="termStart"></label>
    <label>Last day of classes: <input type="date" id="termEnd"></label>
  </div>

  <!-- ADD / EDIT CLASS FORM -->
  <h2 id="formTitle">Add a class</h2>
  <div>
    <input type="text" id="inputCourse" placeholder="Course (e.g. GNG 1105-D00)">
    <input type="text" id="inputType" placeholder="Type (e.g. Lecture)">

    <select id="inputDay">
      <option value="Monday">Monday</option>
      <option value="Tuesday">Tuesday</option>
      <option value="Wednesday">Wednesday</option>
      <option value="Thursday">Thursday</option>
      <option value="Friday">Friday</option>
      <option value="Saturday">Saturday</option>
      <option value="Sunday">Sunday</option>
    </select>

    <input type="time" id="inputStart">
    <input type="time" id="inputEnd">
    <input type="text" id="inputLocation" placeholder="Location">

    <button id="submitBtn" onclick="addClass()">Add Class</button>
  </div>

  <!-- SCREENSHOT UPLOAD -->
  <h2>Or upload a screenshot</h2>
  <input type="file" id="imageInput" accept="image/*">
  <button onclick="extractFromImage()">Extract Classes from Image</button>
  <p id="imageStatus"></p>

  <!-- PASTE TO PARSE -->
  <h2>Or paste your schedule</h2>
  <p>One class per line: <code>Course, Type, Day, Start (HH:MM), End (HH:MM), Location</code></p>
  <textarea id="pasteInput" rows="6" cols="60" placeholder="GNG 1105-D00, Lecture, Monday, 08:30, 09:50, Morisset Hall 218"></textarea>
  <br>
  <button onclick="parsePastedSchedule()">Parse & Add</button>

  <!-- CLASS TABLE -->
  <h2>Your classes</h2>
  <table border="1" cellpadding="6">
    <thead>
      <tr>
        <th>Course</th>
        <th>Type</th>
        <th>Day</th>
        <th>Start</th>
        <th>End</th>
        <th>Location</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="classTableBody">
      <!-- rows get filled in here by JavaScript -->
    </tbody>
  </table>

  <!-- DOWNLOAD -->
  <h2>Export</h2>
  <button onclick="downloadICS()">Download Calendar (.ics)</button>

  <script>
    const classes = [];

    // editingIndex tracks which class (if any) is currently being edited.
    // null means "not editing" — we're in normal Add mode.
    let editingIndex = null;

    // Our own day ordering, Monday-first, to match how people usually
    // think about a school week. Index = position, value = day name.
    const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

    // Maps our day names to the two-letter codes the .ics format requires.
    const ICS_DAY_CODE = {
      Monday: "MO",
      Tuesday: "TU",
      Wednesday: "WE",
      Thursday: "TH",
      Friday: "FR",
      Saturday: "SA",
      Sunday: "SU"
    };

    // Paste your Gemini API key here (from aistudio.google.com/apikey)
    const GEMINI_API_KEY = "AQ.Ab8RN6J_4IFIFS-GB4CWsEYyZnbcFWTo8qZw2SBuYRiCQ_ATxQ";

    function toTitleCase(str) {
      return str
        .toLowerCase()
        .split(" ")
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(" ");
    }

    function normalizeCourse(str) {
      return str.toUpperCase().replace(/\s+/g, "");
    }

    function renderClasses() {
      const tbody = document.getElementById("classTableBody");
      tbody.innerHTML = "";

      classes.forEach((c, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${c.course}</td>
          <td>${c.type}</td>
          <td>${c.day}</td>
          <td>${c.start}</td>
          <td>${c.end}</td>
          <td>${c.location}</td>
          <td>
            <button onclick="startEdit(${index})">Edit</button>
            <button onclick="deleteClass(${index})">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function addClass() {
      const courseRaw = document.getElementById("inputCourse").value;
      const typeRaw = document.getElementById("inputType").value;
      const day = document.getElementById("inputDay").value;
      const start = document.getElementById("inputStart").value;
      const end = document.getElementById("inputEnd").value;
      const locationRaw = document.getElementById("inputLocation").value;

      if (!courseRaw || !typeRaw || !start || !end || !locationRaw) {
        alert("Please fill in every field.");
        return;
      }

      const course = normalizeCourse(courseRaw);
      const type = toTitleCase(typeRaw);
      const location = toTitleCase(locationRaw);

      const newClass = { course, type, day, start, end, location };

      if (editingIndex === null) {
        classes.push(newClass);
      } else {
        classes[editingIndex] = newClass;
        editingIndex = null;
        document.getElementById("formTitle").textContent = "Add a class";
        document.getElementById("submitBtn").textContent = "Add Class";
      }

      renderClasses();
      clearForm();
    }

    function startEdit(index) {
      const c = classes[index];

      document.getElementById("inputCourse").value = c.course;
      document.getElementById("inputType").value = c.type;
      document.getElementById("inputDay").value = c.day;
      document.getElementById("inputStart").value = c.start;
      document.getElementById("inputEnd").value = c.end;
      document.getElementById("inputLocation").value = c.location;

      editingIndex = index;
      document.getElementById("formTitle").textContent = "Edit class";
      document.getElementById("submitBtn").textContent = "Save Changes";
    }

    function deleteClass(index) {
      classes.splice(index, 1);
      renderClasses();
    }

    function clearForm() {
      document.getElementById("inputCourse").value = "";
      document.getElementById("inputType").value = "";
      document.getElementById("inputStart").value = "";
      document.getElementById("inputEnd").value = "";
      document.getElementById("inputLocation").value = "";
    }

    // ---- PASTE TO PARSE (Step 8) ----

    function parsePastedSchedule() {
      const text = document.getElementById("pasteInput").value;

      if (!text.trim()) {
        alert("Paste your schedule text first.");
        return;
      }

      const lines = text.split("\n");
      let addedCount = 0;
      let skippedCount = 0;

      for (const line of lines) {
        const trimmedLine = line.trim();

        // Skip blank lines silently — common when pasting from spreadsheets
        if (trimmedLine === "") {
          continue;
        }

        const fields = trimmedLine.split(",").map(f => f.trim());

        if (fields.length !== 6) {
          skippedCount++;
          continue; // this line doesn't match our expected format, skip it
        }

        const [courseRaw, typeRaw, day, start, end, locationRaw] = fields;

        // Basic sanity check on the day field
        if (!DAYS.includes(day)) {
          skippedCount++;
          continue;
        }

        const newClass = {
          course: normalizeCourse(courseRaw),
          type: toTitleCase(typeRaw),
          day: day,
          start: start,
          end: end,
          location: toTitleCase(locationRaw)
        };

        classes.push(newClass);
        addedCount++;
      }

      renderClasses();
      document.getElementById("pasteInput").value = "";

      alert(`Added ${addedCount} class(es).` + (skippedCount > 0 ? ` Skipped ${skippedCount} line(s) that didn't match the expected format.` : ""));
    }

    // ---- SCREENSHOT EXTRACTION (Step 9) ----

    // Reads a File object and returns a Promise that resolves with its
    // Base64-encoded content (without the "data:image/png;base64," prefix).
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          // reader.result looks like "data:image/png;base64,AAAA..."
          // we only want the part AFTER the comma
          const base64 = reader.result.split(",")[1];
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Sends the uploaded image to Gemini and asks it to extract classes
    // from a schedule screenshot as structured JSON.
    async function extractFromImage() {
      const fileInput = document.getElementById("imageInput");
      const statusEl = document.getElementById("imageStatus");

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Choose an image first.");
        return;
      }

      const file = fileInput.files[0];
      statusEl.textContent = "Reading image...";

      const base64Image = await fileToBase64(file);

      statusEl.textContent = "Asking AI to read your schedule... (this can take a few seconds)";

      const prompt = `You are looking at a screenshot of a university weekly class schedule.
Extract every class you see into a JSON array. Each item must have exactly these fields:
course (string, like "GNG 1105-D00"), type (string, like "Lecture", "Laboratory", or "Tutorial"),
day (one of "Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"),
start (24-hour "HH:MM"), end (24-hour "HH:MM"), location (string).
Respond with ONLY the JSON array, no other text, no markdown code fences.`;

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [
                {
                  parts: [
                    { text: prompt },
                    {
                      inline_data: {
                        mime_type: file.type,
                        data: base64Image
                      }
                    }
                  ]
                }
              ]
            })
          }
        );

        const data = await response.json();

        // If Google sent back an error instead of a successful result, show it clearly
        if (data.error) {
          console.error("Gemini API error:", data.error);
          statusEl.textContent = `API error: ${data.error.message}`;
          return;
        }

        // Navigate the response structure to get the actual text Gemini wrote
        const rawText = data.candidates[0].content.parts[0].text;

        // Strip markdown code fences if the model added them anyway
        const cleanText = rawText.replace(/```json|```/g, "").trim();

        const extractedClasses = JSON.parse(cleanText);

        let addedCount = 0;
        for (const c of extractedClasses) {
          if (!DAYS.includes(c.day)) continue; // skip anything malformed

          classes.push({
            course: normalizeCourse(c.course),
            type: toTitleCase(c.type),
            day: c.day,
            start: c.start,
            end: c.end,
            location: toTitleCase(c.location)
          });
          addedCount++;
        }

        renderClasses();
        statusEl.textContent = `Extracted ${addedCount} class(es) from the image.`;

      } catch (err) {
        console.error(err);
        statusEl.textContent = "Something went wrong reading that image. Check the console for details.";
      }
    }

    // ---- DATE MATH (Step 5) ----

    function dayNameToIndex(dayName) {
      return DAYS.indexOf(dayName);
    }

    function jsDateToOurIndex(date) {
      const jsDay = date.getDay(); // 0=Sunday, 1=Monday, ..., 6=Saturday
      return (jsDay + 6) % 7;
    }

    function findFirstOccurrence(termStartDate, dayName) {
      const targetIndex = dayNameToIndex(dayName);
      const startIndex = jsDateToOurIndex(termStartDate);

      let daysToAdd = targetIndex - startIndex;
      if (daysToAdd < 0) {
        daysToAdd += 7;
      }

      const result = new Date(termStartDate);
      result.setDate(result.getDate() + daysToAdd);
      return result;
    }

    // ---- ICS FILE GENERATION (Step 6) ----

    function pad(n) {
      return n.toString().padStart(2, "0");
    }

    function formatICSDateTime(date, timeStr) {
      const [hours, minutes] = timeStr.split(":");
      const year = date.getFullYear();
      const month = pad(date.getMonth() + 1);
      const day = pad(date.getDate());
      return `${year}${month}${day}T${pad(hours)}${pad(minutes)}00`;
    }

    function formatICSUntil(dateStr) {
      const date = new Date(dateStr + "T23:59:59");
      const year = date.getFullYear();
      const month = pad(date.getMonth() + 1);
      const day = pad(date.getDate());
      return `${year}${month}${day}T235959`;
    }

    function buildEvent(classObj, termStartDate, termEndDateStr, index) {
      const firstOccurrence = findFirstOccurrence(termStartDate, classObj.day);
      const dtStart = formatICSDateTime(firstOccurrence, classObj.start);
      const dtEnd = formatICSDateTime(firstOccurrence, classObj.end);
      const until = formatICSUntil(termEndDateStr);
      const dayCode = ICS_DAY_CODE[classObj.day];
      const uid = `class-${index}-${Date.now()}@classcal`;

      return [
        "BEGIN:VEVENT",
        `UID:${uid}`,
        `DTSTART:${dtStart}`,
        `DTEND:${dtEnd}`,
        `RRULE:FREQ=WEEKLY;BYDAY=${dayCode};UNTIL=${until}`,
        `SUMMARY:${classObj.course} ${classObj.type}`,
        `LOCATION:${classObj.location}`,
        "END:VEVENT"
      ].join("\r\n");
    }

    function buildICSFile() {
      const termStartStr = document.getElementById("termStart").value;
      const termEndStr = document.getElementById("termEnd").value;

      if (!termStartStr || !termEndStr) {
        alert("Please set both term start and end dates.");
        return null;
      }

      if (classes.length === 0) {
        alert("Add at least one class first.");
        return null;
      }

      const termStartDate = new Date(termStartStr + "T00:00:00");

      const events = classes.map((c, index) =>
        buildEvent(c, termStartDate, termEndStr, index)
      );

      const lines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//ClassCal//EN",
        "CALSCALE:GREGORIAN",
        ...events,
        "END:VCALENDAR"
      ];

      return lines.join("\r\n");
    }

    // ---- DOWNLOAD (Step 7) ----

    function downloadICS() {
      const icsContent = buildICSFile();

      // buildICSFile() returns null if validation failed (missing dates/classes)
      if (icsContent === null) {
        return;
      }

      const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = "classcal.ics";

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    }

    renderClasses();
  </script>

</body>
</html>
