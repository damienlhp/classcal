<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassCal</title>
</head>
<body>

  <h1>ClassCal</h1>

  <!-- ADD CLASS FORM -->
  <h2>Add a class</h2>
  <div>
    <input type="text" id="inputCourse" placeholder="Course (e.g. GNG 1105-D00)">
    <input type="text" id="inputType" placeholder="Type (e.g. Lecture)">

    <select id="inputDay">
      <option value="Monday">Monday</option>
      <option value="Tuesday">Tuesday</option>
      <option value="Wednesday">Wednesday</option>
      <option value="Thursday">Thursday</option>
      <option value="Friday">Friday</option>
      <option value="Saturday">Saturday</option>
      <option value="Sunday">Sunday</option>
    </select>

    <input type="time" id="inputStart">
    <input type="time" id="inputEnd">
    <input type="text" id="inputLocation" placeholder="Location">

    <button onclick="addClass()">Add Class</button>
  </div>

  <!-- CLASS TABLE -->
  <h2>Your classes</h2>
  <table border="1" cellpadding="6">
    <thead>
      <tr>
        <th>Course</th>
        <th>Type</th>
        <th>Day</th>
        <th>Start</th>
        <th>End</th>
        <th>Location</th>
      </tr>
    </thead>
    <tbody id="classTableBody">
      <!-- rows get filled in here by JavaScript -->
    </tbody>
  </table>

  <script>
    // Starts empty — classes are added by the user through the page.
    const classes = [];

    // Capitalizes the first letter of every word.
    // "morisset hall 218" -> "Morisset Hall 218"
    function toTitleCase(str) {
      return str
        .toLowerCase()
        .split(" ")
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(" ");
    }

    // Uppercases everything and strips out all spaces.
    // "gng 1105-d00" -> "GNG1105-D00"
    function normalizeCourse(str) {
      return str.toUpperCase().replace(/\s+/g, "");
    }

    function renderClasses() {
      const tbody = document.getElementById("classTableBody");
      tbody.innerHTML = "";

      for (const c of classes) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${c.course}</td>
          <td>${c.type}</td>
          <td>${c.day}</td>
          <td>${c.start}</td>
          <td>${c.end}</td>
          <td>${c.location}</td>
        `;
        tbody.appendChild(row);
      }
    }

    function addClass() {
      const courseRaw = document.getElementById("inputCourse").value;
      const typeRaw = document.getElementById("inputType").value;
      const day = document.getElementById("inputDay").value;
      const start = document.getElementById("inputStart").value;
      const end = document.getElementById("inputEnd").value;
      const locationRaw = document.getElementById("inputLocation").value;

      if (!courseRaw || !typeRaw || !start || !end || !locationRaw) {
        alert("Please fill in every field.");
        return;
      }

      // Apply formatting rules before storing
      const course = normalizeCourse(courseRaw);
      const type = toTitleCase(typeRaw);
      const location = toTitleCase(locationRaw);

      const newClass = { course, type, day, start, end, location };
      classes.push(newClass);

      renderClasses();

      document.getElementById("inputCourse").value = "";
      document.getElementById("inputType").value = "";
      document.getElementById("inputStart").value = "";
      document.getElementById("inputEnd").value = "";
      document.getElementById("inputLocation").value = "";
    }

    renderClasses();
  </script>

</body>
</html>
